# 프롬프트만으로 생성한다 — AI 허브 레퍼런스(txt2img 기반으로 추정)와
# 조건을 맞춰 CLIP Score/FID를 재측정하기 위한 워크플로우다 (docs/benchmarks.md 3장).

[params.lora_name]
node = "10"
field = "lora_name"

