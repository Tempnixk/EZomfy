[project]
name = "styleforge"
version = "0.1.0"
description = "화풍 학습 · 적용 자동화 CLI 툴"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pillow>=10.0",
    "typer>=0.12",
    "imagehash>=4.3",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "psutil>=5.9",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# torch/torchvision은 Windows 기본 PyPI 인덱스가 CUDA 포함 빌드를 주므로
# CPU 전용 인덱스로 설치할 것 (evaluate는 ComfyUI/kohya와 VRAM을 다투지 않는다):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
#   pip install open-clip-torch pytorch-fid
evaluate = ["torch", "torchvision", "open-clip-torch", "pytorch-fid>=0.3"]

[project.scripts]
styleforge = "styleforge.cli:app"
styleforge-gui = "styleforge.gui.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["styleforge*"]
